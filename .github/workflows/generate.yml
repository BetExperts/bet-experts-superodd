name: Bet365 Super Odd

on:
  # LET OP: de uurlijkse cron staat UIT — Bet365 blokkeert het GitHub-datacenter-IP.
  # De agent draait op de Mac (LaunchAgent com.betexperts.superodd, 08:15-23:15).
  # Wil je 'm tóch in de cloud draaien? Zet een NL-proxy in de secrets
  # (PROXY_SERVER/PROXY_USER/PROXY_PASS) en haal onderstaande cron uit commentaar.
  #  schedule:
  #    - cron: "15 * * * *"
  workflow_dispatch:      # handmatig starten kan altijd (bv. om met proxy te testen)

jobs:
  superodd:
    runs-on: ubuntu-latest
    concurrency:
      group: superodd
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Genereer Super Odd
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optioneel; laat leeg om het standaardkanaal @BetExpertsGroup te gebruiken.
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          # Optioneel: NL-proxy om het geo/bot-block te omzeilen vanaf de cloud.
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python generate.py

      - name: Commit state terug
        run: |
          git config user.name "superodd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/superodd.json || true
          git commit -m "state: Super Odd $(date -u +%F)" || echo "geen wijzigingen"
          git pull --rebase --autostash || true
          git push || echo "niets te pushen"
