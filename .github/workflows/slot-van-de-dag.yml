name: Slot van de dag (casino-kanaal)

# Elke dag om 19:00 NL-tijd één slot (review + score + demo) in Telegram (@betexpertscasino).
# Draait in de cloud, dus ook als de Mac uit staat. Cron is UTC: 17:00 én 18:00 UTC,
# het script post alleen vanaf 19:00 NL-tijd en max. 1x per dag (zomer- én wintertijd goed).
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency:
      group: slot-van-de-dag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install "requests>=2.31.0"

      - name: Post slot van de dag
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: python slot_van_de_dag.py --post --vanaf 19

      - name: Commit state terug
        run: |
          git config user.name "slot-van-de-dag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/slot_van_de_dag.json || true
          git commit -m "state: slot van de dag $(date -u +%F)" || echo "geen wijzigingen"
          git pull --rebase --autostash || true
          git push || echo "niets te pushen"
